<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Category | Deccan Midwest Supply Co.</title>
  <style>
    :root {
      --navy: #10233d;
      --plum: #3d1f45;
      --gold: #c9a968;
      --ivory: #f8f4ee;
      --line: rgba(16, 35, 61, 0.12);
      --muted: #5a6470;
      --ink: #171d28;
      --max: 1200px;
      --sx: 28px;
      --shadow-soft: 0 22px 52px rgba(16, 35, 61, 0.07);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f9f4ee 0%, #fffdfb 20%, #f5f1eb 100%);
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    button, input { font: inherit; }
    .container { max-width: var(--max); margin: 0 auto; padding: 0 var(--sx); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(16, 35, 61, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .topbar-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 18px var(--sx);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .brand img { width: 42px; height: 42px; }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: var(--navy);
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      box-shadow: 0 12px 24px rgba(201, 169, 104, 0.25);
    }

    .header-surface {
      position: relative;
      background: linear-gradient(135deg, rgba(61,31,69,.96), rgba(16,35,61,.92));
      color: white;
      overflow: hidden;
    }
    .header-surface::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(201,169,104,.28), transparent 36%);
    }
    .header-inner {
      position: relative;
      z-index: 1;
      max-width: var(--max);
      margin: 0 auto;
      padding: 56px var(--sx) 26px;
    }
    .page-tag {
      margin: 0 0 16px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 26px;
      flex-wrap: wrap;
    }
    .page-header h1 {
      margin: 0;
      font-size: clamp(2.6rem, 5vw, 5rem);
      line-height: 0.94;
      letter-spacing: -.06em;
    }
    .category-summary {
      margin: 18px 0 0;
      max-width: 760px;
      color: rgba(255,255,255,.8);
      font-size: 1.02rem;
      line-height: 1.8;
    }
    .category-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .category-highlights span {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.82);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .aux-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 14px 20px;
      font-weight: 800;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.16);
      color: white;
    }
    .category-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.78);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .chip.active {
      background: rgba(201,169,104,.14);
      border-color: rgba(201,169,104,.8);
      color: white;
    }

    .category-intro {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
      padding: 26px 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.74);
      box-shadow: var(--shadow-soft);
    }
    .section-kicker {
      margin: 0 0 10px;
      color: var(--plum);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .category-intro h2 {
      margin: 0;
      max-width: 680px;
      font-size: clamp(1.7rem, 3vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -.05em;
    }
    .category-intro p:not(.section-kicker) {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .section-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .section-nav a {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--navy);
      font-size: 12px;
      font-weight: 800;
    }
    .section-nav a:hover, .section-nav a:focus-visible {
      border-color: var(--gold);
      background: #fffaf0;
    }

    main {
      padding: 54px 0 96px;
    }
    .product-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }
    .product-card {
      border-radius: 30px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.9);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      scroll-margin-top: 112px;
    }
    .product-layout {
      display: grid;
      grid-template-columns: 1.08fr 1.2fr;
      gap: 0;
    }
    .gallery {
      background: linear-gradient(180deg, #eef2f6 0%, #edf0f7 100%);
      border-right: 1px solid var(--line);
      padding: 22px;
    }
    .main-photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 22px;
      border: 1px solid rgba(16,35,61,.08);
      box-shadow: 0 18px 28px rgba(16,35,61,.08);
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, minmax(70px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .thumbs img {
      width: 100%;
      height: 86px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(16,35,61,.08);
    }
    .product-info {
      padding: 28px;
    }
    .section-marker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--plum);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .section-marker strong {
      display: inline-flex;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: var(--plum);
      color: white;
      font-size: 12px;
      letter-spacing: 0;
    }
    .sku {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 800;
    }
    .product-info h2 {
      margin: 12px 0 0;
      font-size: clamp(2rem, 2.6vw, 3rem);
      line-height: 1.06;
      letter-spacing: -.05em;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 22px;
    }
    .meta-row span {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f5efe8;
      color: var(--navy);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .description {
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.85;
    }
    .quantity-wrap {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .qty-selector {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }
    .qty-selector span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .qty-selector input {
      width: 46px;
      border: 0;
      background: transparent;
      font-size: 1rem;
      color: var(--ink);
      text-align: center;
      outline: none;
    }
    .secondary, .primary, .ghost {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .primary {
      background: var(--plum);
      color: white;
    }
    .secondary {
      background: var(--gold);
      color: var(--navy);
    }
    .ghost {
      background: white;
      color: var(--ink);
      border-color: var(--line);
    }
    .buy-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .section-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 14px;
      border-radius: 10px;
      background: var(--navy);
      color: white;
      font-size: 12px;
      font-weight: 800;
    }
    .section-cta:hover, .section-cta:focus-visible { background: var(--plum); }
    .segment-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }
    .segment-point {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #faf7f3;
      color: var(--ink);
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }
    .segment-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(170px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }
    .segment-point {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #faf7f3;
      color: var(--ink);
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
    }
    a.segment-point:hover, a.segment-point:focus-visible {
      border-color: var(--gold);
      background: #fffaf0;
      color: var(--plum);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(190px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }
    .detail-box {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfaf8;
    }
    .detail-box small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .detail-box strong {
      display: block;
      margin-top: 10px;
      line-height: 1.45;
      font-size: 1rem;
    }
    .details-panel {
      padding: 0 28px 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 18px;
    }
    .spec-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
    }
    .spec-card h3 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      letter-spacing: -.03em;
    }
    .spec-card table {
      width: 100%;
      border-collapse: collapse;
    }
    .spec-card th,
    .spec-card td {
      text-align: left;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .spec-card th {
      width: 42%;
      padding-right: 10px;
    }
    .spec-card td {
      color: var(--muted);
    }
    .spec-card ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.9;
    }
    .related-wrap {
      padding: 0 28px 28px;
    }
    .related {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }
    .mini-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }
    .mini-card h4 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }
    .mini-card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.7;
    }
    .mini-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 8px 12px;
      font-weight: 700;
      background: #faf7f3;
    }

    @media (max-width: 860px) {
      .category-intro { grid-template-columns: 1fr; }
      .section-nav { justify-content: flex-start; }
      .product-layout { grid-template-columns: 1fr; }
      .details-panel { grid-template-columns: 1fr; }
      .related { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .topbar-inner { flex-direction: column; align-items: flex-start; }
      .page-header { align-items: flex-start; }
      .category-intro { padding: 22px 18px; }
      .detail-grid { grid-template-columns: 1fr; }
      .product-info, .gallery, .details-panel, .related-wrap { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html#home" aria-label="Deccan Midwest Supply Co. home">
        <img src="./assets/logo-emblem.png" alt="Deccan Midwest Supply Co." />
        <span>Deccan Midwest Supply Co.</span>

      <div id="categoryHighlights" class="category-highlights"></div>

  <main>
    <div class="container">
      <section class="category-intro" aria-labelledby="buyingTitle">
        <div>
          <p class="section-kicker">Category playbook</p>
          <h2 id="buyingTitle">Source by operating need, then specify the format.</h2>
          <p>Each section groups the formats buyers typically compare, with the commercial attributes needed for a faster quote conversation.</p>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="Category sections"></nav>
      </section>
      <div id="productsRoot" class="product-list"></div>
    </div>
  </main>

  <script>
    const categoryMap = {
      cups: { label: 'Cups, Lids & Drinkware' },

    const categoryDescriptions = {
      cups: 'This category serves restaurants, cafés, coffee shops, convenience stores, catering businesses and other beverage operations. It covers hot beverage cups, cold beverage cups, lids, straws, stirrers, accessories and portion cups with filter options for capacity, material, color, lid compatibility and pack quantity.',

      paper: 'This category extends Deccan Midwest beyond food packaging and creates recurring facility-supply revenue through paper towels, center-pull and roll towels, tissue, wipes and dispensing systems for restaurants, offices and commercial facilities.',

      waste: 'This is a straightforward, repeat-order category for commercial customers, including can liners, trash bags, recycled liners and different gallon capacities, dimensions, thicknesses, colors and case counts.',

      takeout: {

    const categoryOrder = ['cups', 'takeout', 'bags', 'gloves', 'tableware', 'wraps', 'paper', 'chemicals', 'waste', 'shipping'];

    const title = document.getElementById('pageTitle');
    const summary = document.getElementById('categorySummary');
    const highlights = document.getElementById('categoryHighlights');
    const root = document.getElementById('productsRoot');
    const sectionNav = document.getElementById('sectionNav');
    title.textContent = categoryMap[pageKey]?.label || 'Commercial products';
    summary.textContent = categoryDescriptions[pageKey] || categoryDescriptions.cups;
    highlights.innerHTML = (categoryHighlights[pageKey] || categoryHighlights.cups).map(item => `<span>${item}</span>`).join('');

    const categoryData = catalog[pageKey] || catalog.cups;
    sectionNav.innerHTML = categoryData.segments.map((segment, index) => `<a href="#segment-${index + 1}">${segment.title}</a>`).join('');
    root.innerHTML = categoryData.segments.map((segment, index) => {
      const detailRows = [
        ['Focus', segment.title],
        ['Typical products', segment.items.join(' • ')],
        ['Popular filters', segment.filters.join(' • ')],
        ['Applications', segment.description]
      ];

      return `
        <article class="product-card" id="segment-${index + 1}">
          <div class="product-layout">
            <div class="gallery">
              <img class="main-photo" src="${segment.photoSet[0]}" alt="${segment.title}" />
              <div class="thumbs">
                ${segment.photoSet.map(photo => `<img src="${photo}" alt="${segment.title} view" />`).join('')}
              </div>
            </div>

            <div class="product-info">
              <div class="section-marker"><strong>${String(index + 1).padStart(2, '0')}</strong> Operating section</div>
              <div class="sku">${segment.title}</div>
              <h2>${segment.title}</h2>
              <div class="meta-row">${segment.tags.map(tag => `<span>${tag}</span>`).join('')}</div>
              <p class="description">${segment.description}</p>

              <div class="segment-list">
                ${segment.items.map(item => {
                  const href = `browse-items.html?category=${pageKey}&search=${encodeURIComponent(item)}`;
                  return `<a class="segment-point" href="${href}">${item}</a>`;
                }).join('')}
              </div>

              <div class="detail-grid">
                <div class="detail-box"><small>Typical use</small><strong>${segment.title}</strong></div>
                <div class="detail-box"><small>Filter options</small><strong>${segment.filters.slice(0, 2).join(' / ')}</strong></div>
                <div class="detail-box"><small>Volume fit</small><strong>Case quantities &amp; pack sizing</strong></div>
                <div class="detail-box"><small>Catalog view</small><strong>Built for operational buyers</strong></div>
              </div>
              <div class="buy-actions">
                <a class="section-cta" href="browse-items.html">Browse ${segment.title}</a>
              </div>
            </div>
          </div>

          <div class="details-panel">
            <div class="spec-card">
              <h3>Typical product mix</h3>
              <table>${detailRows.map(([label, value]) => `
                <tr>
                  <th>${label}</th>
                  <td>${value}</td>
                </tr>
              `).join('')}</table>
            </div>
            <div class="spec-card">
              <h3>Filterable attributes</h3>
              <ul>${segment.filters.map(filter => `<li>${filter}</li>`).join('')}</ul>
            </div>
          </div>
        </article>
      `;
    }).join('');
  </script>
</body>
</html>
